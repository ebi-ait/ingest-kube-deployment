variables:
  ENVIRONMENT_NAME: 
    value: "dev"
    description: "The environment to update the secret in"
    options:
      - "dev"
      - "staging" 
      - "prod"
  SECRET_VALUE: 
    description: "The value of the secret to update, usually sent by email or slack"
    value: ""
  INGEST_KUBE_DEPLOYMENT_REPO: "https://github.com/ebi-ait/ingest-kube-deployment.git"


stages:
  # rotate gcp secret, see https://github.com/ebi-ait/dcp-ingestcentral#dcp-1074
  - rotate_secret
  - contributor_account

.aws_config:
  before_script:
    - aws configure set profile.embl-ebi.region us-east-1
    - aws configure set profile.embl-ebi.output json
    - aws configure set profile.ebi.aws_access_key_id "$AWS_ACCESS_KEY_ID"
    - aws configure set profile.ebi.aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
    - aws configure set profile.embl-ebi.source_profile ebi
    - aws configure set profile.embl-ebi.role_arn "arn:aws:iam::871979166454:role/ingest-devops"
    - export AWS_PROFILE=embl-ebi

.rotate_secret:
  image: noose/kubectl-helm-aws:1.31.0-3.16.3-2.21.0
  variables:
    SECRET_NAME: "ingest/$ENVIRONMENT_NAME/secrets"
  extends: .aws_config
  script:
    - |
      if [[ -z "${SECRET_NAME:-}" ]]; then
        echo "❌ ERROR: SECRET_NAME environment variable is not set."
        exit 1
      fi
      if [[ -z "${SECRET_VALUE:-}" ]]; then
        echo "❌ ERROR: SECRET_VALUE environment variable is not set."
        exit 1
      fi
      echo "Getting current secret: $SECRET_NAME"
      # Get the current secret
      CURRENT_SECRET=$(aws secretsmanager get-secret-value \
          --secret-id "$SECRET_NAME" \
          --query SecretString \
          --output text)
      
      if [[ -z "$CURRENT_SECRET" ]]; then
        echo "❌ ERROR: Could not retrieve current secret."
        exit 1
      fi
      
      # Backup the current secret before updating
      BACKUP_SECRET_NAME="${SECRET_NAME}-backup-$(date +%Y%m%d-%H%M%S)"
      echo "Creating backup: $BACKUP_SECRET_NAME"
      aws secretsmanager create-secret \
          --name "$BACKUP_SECRET_NAME" \
          --secret-string "$CURRENT_SECRET" \
          --description "Backup of $SECRET_NAME created before update on $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      echo "✅ Backup created: $BACKUP_SECRET_NAME"
      
      echo "Updating ingest_exporter_terra_svc_account field in secret: $SECRET_NAME"
      # Update only the ingest_exporter_terra_svc_account field
      UPDATED_SECRET=$(echo "$CURRENT_SECRET" | jq --arg new_value "$SECRET_VALUE" '.ingest_exporter_terra_svc_account = $new_value')
      
      # Put the updated secret back
      aws secretsmanager put-secret-value \
          --secret-id "$SECRET_NAME" \
          --secret-string "$UPDATED_SECRET"
      echo "✅ Secret '$SECRET_NAME' updated successfully. Only ingest_exporter_terra_svc_account field was modified."
  when: manual


.update_secret_in_k8s:
  image: noose/kubectl-helm-aws:1.31.0-3.16.3-2.21.0
  variables:
    SECRET_NAME: "ingest/$ENVIRONMENT_NAME/secrets"
  extends: .aws_config
  script:
    - |
      if [[ -z "${SECRET_NAME:-}" ]]; then
        echo "❌ ERROR: SECRET_NAME environment variable is not set."
        exit 1
      fi
      echo "Updating secret: $SECRET_NAME"

    - source config/environment_$ENVIRONMENT_NAME
    - cd apps
    - set -vx
    - ./scripts/deploy_secrets
    - kubectl rollout restart deployment ingest-exporter

rotate_secret:
  stage: rotate_secret
  extends: .rotate_secret
  parallel:
    matrix:
      - ENVIRONMENT_NAME: 
        - "dev"
        # - "staging"
        # - "prod"
  environment:
    name: $ENVIRONMENT_NAME
  when: manual

update_secret_in_k8s:
  stage: rotate_secret
  extends: .update_secret_in_k8s
  parallel:
    matrix:
      - ENVIRONMENT_NAME: dev
        BRANCH_NAME: dev
      # - ENVIRONMENT_NAME: ["staging", "prod"]
        # BRANCH_NAME: master
  environment:
    name: $ENVIRONMENT_NAME
    kubernetes:
      namespace: "$ENVIRONMENT_NAME-environment"
  needs: ["rotate_secret"]
